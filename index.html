<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no" />
  <title>Тайный Санта</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="snow" aria-hidden="true"></div>
  <main id="app" class="app"></main>

  <!-- Фолбэк MainButton для просмотра вне Telegram -->
  <div id="fallback-main" class="fallback-main" hidden>
    <button type="button" class="btn btn--primary btn--block" id="fallback-main-btn"></button>
  </div>
  <button type="button" id="fallback-back" class="fallback-back" hidden aria-label="Назад">‹ Назад</button>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
