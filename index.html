<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="theme-color" content="#111b3a" />
  <title>Тайный Санта · Р-СТРОЙ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    /* Основная тема — «Морозное утро» с фирменными иллюстрациями.
       Запасные варианты: ?theme=classic | aurora | dusk | retro | neon | velvet | minimal | cozy */
    (function () {
      var t = new URLSearchParams(location.search).get("theme") || "frost";
      if (t !== "classic") document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Manrope:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Oswald:wght@500;700&family=Lobster&family=Marck+Script&family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=8" />
  <link rel="stylesheet" href="css/themes.css?v=8" />
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <main id="app" class="app"></main>

  <!-- Фолбэк MainButton/BackButton для просмотра вне Telegram -->
  <div id="fallback-main" class="fallback-main" hidden>
    <button type="button" class="btn btn--primary btn--block" id="fallback-main-btn"></button>
  </div>
  <button type="button" id="fallback-back" class="fallback-back" hidden aria-label="Назад">
    <svg class="i i--sm" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>Назад
  </button>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/art.js?v=8"></script>
  <script src="js/art-themes.js?v=8"></script>
  <script src="js/data.js?v=8"></script>
  <script src="js/app.js?v=8"></script>
</body>
</html>
